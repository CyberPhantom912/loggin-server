<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bienvenido · Loggin</title>
<style>
  :root { --blue:#0b5fff; --border:#dadde1; --text:#1c1e21; --text-2:#65676b; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh; display: grid; place-items: center;
    background: #fff; color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    padding: 24px; text-align: center;
  }
  .card { max-width: 420px; border: 1px solid var(--border); border-radius: 10px; padding: 36px; }
  h1 { margin: 0 0 8px; font-size: 24px; }
  p { color: var(--text-2); margin: 0 0 24px; }
  a.btn {
    display: inline-block; padding: 12px 20px; border-radius: 8px; background: var(--blue);
    color: #fff; text-decoration: none; font-weight: 600; margin: 4px;
  }
  a.link { display: inline-block; margin: 4px; color: var(--blue); text-decoration: none; }
</style>
</head>
<body>
  <div class="card">
    <h1 id="title">Cargando…</h1>
    <p id="sub"></p>
    <a class="btn" href="/datos.html">Ver datos guardados</a>
    <br>
    <a class="link" href="#" id="logout">Cerrar sesión</a>
  </div>
  <script>
    fetch("/api/auth/me").then(async (res) => {
      if (!res.ok) { location.href = "/login.html"; return; }
      const user = await res.json();
      document.getElementById("title").textContent = "Hola, " + user.identifier;
      document.getElementById("sub").textContent = "Iniciaste sesión correctamente.";
    });
    document.getElementById("logout").addEventListener("click", async (e) => {
      e.preventDefault();
      await fetch("/api/auth/logout", { method: "POST" });
      location.href = "/login.html";
    });
  </script>
</body>
</html>
