<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iniciar sesión</title>
<meta name="description" content="Inicia sesión para continuar.">
<style>
  :root {
    --bg: #ffffff;
    --surface: #ffffff;
    --field: #f5f6f7;
    --border: #dadde1;
    --border-strong: #c4c8cd;
    --text: #1c1e21;
    --text-2: #65676b;
    --text-3: #8a8d91;
    --blue: #0b5fff;
    --blue-hover: #084fd6;
    --blue-press: #0743b5;
    --blue-ring: rgba(11, 95, 255, .18);
    --danger: #d92d20;
    --danger-bg: #fef3f2;
    --radius: 8px;
    --gap: 12px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  a { color: var(--blue); text-decoration: none; }
  a:hover { text-decoration: underline; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 4px; }

  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  /* ---------- Layout ---------- */
  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    padding: 48px 32px;
  }

  /* ---------- Zona de acceso ---------- */
  .access { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 16px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 32px;
  }

  .brand { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-bottom: 28px; text-align: center; }
  .brand-name { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -.02em; }
  .brand-sub { margin: -6px 0 0; color: var(--text-2); font-size: 14px; }

  form { display: flex; flex-direction: column; gap: 10px; }

  .field { position: relative; }
  .input {
    width: 100%;
    height: 48px;
    padding: 0 16px;
    font: inherit;
    color: var(--text);
    background: var(--field);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    transition: border-color .15s ease, box-shadow .15s ease, background-color .15s ease;
    -webkit-appearance: none;
    appearance: none;
  }
  .input::placeholder { color: var(--text-3); }
  .input:hover { border-color: var(--border-strong); }
  .input:focus { outline: none; background: #fff; border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-ring); }
  .input[aria-invalid="true"] { border-color: var(--danger); background: var(--danger-bg); }
  .input[aria-invalid="true"]:focus { box-shadow: 0 0 0 3px rgba(217,45,32,.15); }
  .field.has-toggle .input { padding-right: 48px; }

  .toggle {
    position: absolute; top: 0; right: 0;
    width: 48px; height: 48px;
    display: grid; place-items: center;
    background: none; border: 0; border-radius: 0 var(--radius) var(--radius) 0;
    color: var(--text-3); cursor: pointer;
    transition: color .15s ease;
  }
  .toggle:hover { color: var(--text); }
  .toggle svg { width: 20px; height: 20px; }
  .toggle .eye-off { display: none; }
  .toggle[aria-pressed="true"] .eye { display: none; }
  .toggle[aria-pressed="true"] .eye-off { display: block; }

  .error-msg { margin: 6px 2px 0; font-size: 13px; color: var(--danger); }
  .alert {
    display: none;
    padding: 10px 12px;
    font-size: 14px;
    color: var(--danger);
    background: var(--danger-bg);
    border: 1px solid #fecdca;
    border-radius: var(--radius);
  }
  .alert.show { display: block; }
  .alert.warn { color: #93370d; background: #fffaeb; border-color: #fedf89; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; height: 48px;
    padding: 0 16px;
    font: inherit; font-size: 16px; font-weight: 600;
    border-radius: var(--radius);
    border: 1px solid transparent;
    cursor: pointer;
    transition: background-color .15s ease, border-color .15s ease, transform .05s ease, opacity .15s ease;
    text-decoration: none;
  }
  .btn:hover { text-decoration: none; }
  .btn-primary { margin-top: 6px; color: #fff; background: var(--blue); }
  .btn-primary:hover { background: var(--blue-hover); }
  .btn-primary:active { background: var(--blue-press); transform: translateY(1px); }
  .btn-primary:disabled { cursor: not-allowed; opacity: .6; transform: none; }
  .btn-primary[aria-busy="true"] { cursor: progress; opacity: .85; }
  .btn-secondary { color: var(--text); background: #fff; border-color: var(--border); font-weight: 600; font-size: 15px; }
  .btn-secondary:hover { background: var(--field); border-color: var(--border-strong); }
  .btn-secondary svg { width: 20px; height: 20px; flex: none; }

  .spinner {
    display: none; width: 18px; height: 18px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.4); border-top-color: #fff;
    animation: spin .7s linear infinite;
  }
  [aria-busy="true"] .spinner { display: block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .forgot { display: block; margin: 14px 0 0; text-align: center; font-size: 14px; }

  .divider {
    display: flex; align-items: center; gap: 14px;
    margin: 20px 0;
    color: var(--text-3); font-size: 13px; font-weight: 500;
  }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }

  .signup { padding: 20px 32px; text-align: center; font-size: 15px; color: var(--text-2); }
  .signup a { font-weight: 600; }

  footer {
    width: 100%;
    max-width: 1180px;
    margin: 0 auto;
    padding: 20px 32px 32px;
    display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 20px;
    font-size: 13px; color: var(--text-3);
  }
  footer a { color: var(--text-3); }
  footer a:hover { color: var(--text-2); }

  /* ---------- Adaptable ---------- */
  @media (max-width: 1040px) {
    main { padding: 40px 24px; }
    .card { padding: 28px; }
  }

  @media (max-width: 860px) {
    main { padding: 32px 20px; }
    footer { padding: 8px 20px 28px; }
  }

  @media (max-width: 420px) {
    main { padding: 20px 16px; }
    .card { padding: 24px 20px; }
    .signup { padding: 18px 20px; }
    .input, .btn { height: 50px; }
    .toggle { height: 50px; }
    .input { font-size: 16px; } /* evita el zoom automático en iOS */
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation-duration: .01ms !important; }
  }
</style>
</head>
<body>

<main>
  <!-- Zona de acceso -->
  <section class="access" aria-label="Acceso">
    <div class="card">
      <div class="brand">
        <h1 class="brand-name" id="brand-name"></h1>
        <p class="brand-sub">Inicia sesión para continuar</p>
      </div>

      <form id="login-form" novalidate>
        <div class="alert" id="alert" role="alert" aria-live="assertive"></div>

        <div>
          <div class="field">
            <label class="sr-only" for="identifier">Correo electrónico o nombre de usuario</label>
            <input class="input" id="identifier" name="identifier" type="text"
                   placeholder="Correo electrónico o nombre de usuario"
                   autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false"
                   aria-describedby="identifier-error" required>
          </div>
          <p class="error-msg" id="identifier-error" hidden></p>
        </div>

        <div>
          <div class="field has-toggle">
            <label class="sr-only" for="password">Contraseña</label>
            <input class="input" id="password" name="password" type="password"
                   placeholder="Contraseña" autocomplete="current-password"
                   aria-describedby="password-error" required>
            <button class="toggle" id="toggle" type="button" aria-pressed="false" aria-controls="password" aria-label="Mostrar contraseña">
              <svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.9 17.9A10.6 10.6 0 0 1 12 19c-6.4 0-10-7-10-7a18.3 18.3 0 0 1 5.1-5.9M9.9 5.2A9.7 9.7 0 0 1 12 5c6.4 0 10 7 10 7a18.4 18.4 0 0 1-2.2 3.2M1 1l22 22"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
            </button>
          </div>
          <p class="error-msg" id="password-error" hidden></p>
        </div>

        <button class="btn btn-primary" id="submit" type="submit">
          <span class="spinner" aria-hidden="true"></span>
          <span id="submit-label">Iniciar sesión</span>
        </button>
      </form>

      <a class="forgot" id="forgot" href="#">¿Olvidaste tu contraseña?</a>

      <div id="provider-wrap" hidden>
        <div class="divider" role="separator"><span>o</span></div>
        <a class="btn btn-secondary" id="provider" href="#">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6l8-3z"/><path d="M9 12l2 2 4-4"/></svg>
          <span id="provider-label"></span>
        </a>
      </div>
    </div>

    <div class="card signup">
      ¿No tienes una cuenta? <a id="register" href="#">Crear cuenta</a>
    </div>
  </section>
</main>

<footer id="footer" aria-label="Información"></footer>

<script>
/* ============================================================
   CONFIGURACIÓN — edita solo este bloque para conectar tu proyecto
   ============================================================ */
const CONFIG = {
  projectName: "Loggin",                 // Nombre que aparece arriba

  // Endpoint de TU sistema de autenticación. Debe ser HTTPS en producción.
  // Recibe POST JSON { identifier, password } y responde 200 si es válido.
  authEndpoint: "/api/auth/login",
  redirectTo: "/inicio.html",             // A dónde ir tras iniciar sesión (misma web)

  recoverUrl: "/recuperar",
  registerUrl: "/registro.html",
  provider: { label: "Continuar con tu proveedor de identidad", url: "" }, // url vacía = oculto
  minPasswordLength: 6,

  footerLinks: [
    { label: "Acerca de", url: "/acerca" },
    { label: "Ayuda", url: "/ayuda" },
    { label: "Privacidad", url: "/privacidad" },
    { label: "Términos", url: "/terminos" }
  ]
};

/* ============================================================ */
(function () {
  const $ = (id) => document.getElementById(id);
  const form = $("login-form"), idInput = $("identifier"), pwInput = $("password");
  const submitBtn = $("submit"), submitLabel = $("submit-label"), alertBox = $("alert");

  /* ---- Identidad ---- */
  document.title = "Iniciar sesión · " + CONFIG.projectName;
  $("brand-name").textContent = CONFIG.projectName;
  $("forgot").href = CONFIG.recoverUrl;
  $("register").href = CONFIG.registerUrl;

  if (CONFIG.provider && CONFIG.provider.url) {
    $("provider").href = CONFIG.provider.url;
    $("provider-label").textContent = CONFIG.provider.label;
    $("provider-wrap").hidden = false;
  }

  const footer = $("footer");
  CONFIG.footerLinks.forEach((l) => {
    const a = document.createElement("a");
    a.href = l.url; a.textContent = l.label;
    footer.appendChild(a);
  });
  const copy = document.createElement("span");
  copy.textContent = "© " + new Date().getFullYear() + " " + CONFIG.projectName;
  footer.appendChild(copy);

  /* ---- Mostrar / ocultar contraseña ---- */
  const toggle = $("toggle");
  toggle.addEventListener("click", () => {
    const show = pwInput.type === "password";
    pwInput.type = show ? "text" : "password";
    toggle.setAttribute("aria-pressed", String(show));
    toggle.setAttribute("aria-label", show ? "Ocultar contraseña" : "Mostrar contraseña");
    pwInput.focus();
  });

  /* ---- Conexión segura ---- */
  const isLocal = ["localhost", "127.0.0.1", "[::1]"].includes(location.hostname);
  const insecure = location.protocol === "http:" && !isLocal;
  function showAlert(msg, warn) {
    alertBox.textContent = msg;
    alertBox.classList.toggle("warn", !!warn);
    alertBox.classList.add("show");
  }
  function clearAlert() { alertBox.classList.remove("show"); alertBox.textContent = ""; }
  if (insecure) {
    showAlert("Esta conexión no es segura (HTTP). Abre la página con HTTPS para iniciar sesión.", true);
    submitBtn.disabled = true;
  }

  /* ---- Validación ---- */
  function setFieldError(input, msg) {
    const out = $(input.id + "-error");
    if (msg) {
      input.setAttribute("aria-invalid", "true");
      out.textContent = msg; out.hidden = false;
    } else {
      input.removeAttribute("aria-invalid");
      out.textContent = ""; out.hidden = true;
    }
  }
  const emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
  const userRe = /^[A-Za-z0-9._-]{3,}$/;

  function validate() {
    let first = null;
    const id = idInput.value.trim();
    let idMsg = "";
    if (!id) idMsg = "Escribe tu correo electrónico o nombre de usuario.";
    else if (id.includes("@") ? !emailRe.test(id) : !userRe.test(id))
      idMsg = id.includes("@") ? "Ese correo electrónico no parece válido." : "Ese nombre de usuario no parece válido.";
    setFieldError(idInput, idMsg);
    if (idMsg) first = idInput;

    let pwMsg = "";
    if (!pwInput.value) pwMsg = "Escribe tu contraseña.";
    else if (pwInput.value.length < CONFIG.minPasswordLength)
      pwMsg = "La contraseña debe tener al menos " + CONFIG.minPasswordLength + " caracteres.";
    setFieldError(pwInput, pwMsg);
    if (pwMsg && !first) first = pwInput;

    if (first) first.focus();
    return !first;
  }
  idInput.addEventListener("input", () => { if (idInput.getAttribute("aria-invalid")) setFieldError(idInput, ""); clearAlert(); });
  pwInput.addEventListener("input", () => { if (pwInput.getAttribute("aria-invalid")) setFieldError(pwInput, ""); clearAlert(); });

  /* ---- Envío ---- */
  function setLoading(on) {
    submitBtn.disabled = on || insecure;
    submitBtn.setAttribute("aria-busy", String(on));
    submitLabel.textContent = on ? "Iniciando sesión…" : "Iniciar sesión";
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    clearAlert();
    if (insecure || !validate()) return;

    setLoading(true);
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 15000);
    try {
      const res = await fetch(CONFIG.authEndpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        credentials: "same-origin",   // la sesión debe guardarse en una cookie HttpOnly desde tu servidor
        cache: "no-store",
        body: JSON.stringify({ identifier: idInput.value.trim(), password: pwInput.value }),
        signal: controller.signal
      });

      if (res.ok) {
        pwInput.value = "";
        submitLabel.textContent = "¡Listo!";
        window.location.assign(CONFIG.redirectTo);
        return;
      }
      if (res.status === 400 || res.status === 401 || res.status === 403) {
        showAlert("El usuario o la contraseña no son correctos. Revisa los datos e inténtalo de nuevo.");
        pwInput.select();
      } else if (res.status === 429) {
        showAlert("Demasiados intentos. Espera unos minutos antes de volver a intentarlo.");
      } else {
        showAlert("No pudimos iniciar sesión por un problema de nuestro lado. Inténtalo de nuevo en un momento.");
      }
    } catch (err) {
      showAlert(err.name === "AbortError"
        ? "La solicitud tardó demasiado. Revisa tu conexión e inténtalo otra vez."
        : "No hay conexión con el servidor. Revisa tu internet e inténtalo otra vez.");
    } finally {
      clearTimeout(timer);
      setLoading(false);
    }
  });
})();
</script>
</body>
</html>
