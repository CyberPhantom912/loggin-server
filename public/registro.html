<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crear cuenta · Loggin</title>
<style>
  :root { --blue:#0b5fff; --blue-hover:#084fd6; --field:#f5f6f7; --border:#dadde1; --text:#1c1e21; --text-2:#65676b; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh; display: grid; place-items: center;
    background: #fff; color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    padding: 24px;
  }
  .card { width: 100%; max-width: 360px; border: 1px solid var(--border); border-radius: 10px; padding: 32px; }
  h1 { font-size: 22px; margin: 0 0 4px; text-align: center; }
  p.sub { margin: 0 0 24px; text-align: center; color: var(--text-2); font-size: 14px; }
  form { display: flex; flex-direction: column; gap: 10px; }
  input {
    height: 48px; padding: 0 16px; font: inherit; border: 1px solid var(--border);
    border-radius: 8px; background: var(--field);
  }
  input:focus { outline: none; border-color: var(--blue); background: #fff; }
  button {
    height: 48px; margin-top: 6px; border: 0; border-radius: 8px; background: var(--blue);
    color: #fff; font-size: 16px; font-weight: 600; cursor: pointer;
  }
  button:hover { background: var(--blue-hover); }
  .msg { font-size: 14px; min-height: 20px; text-align: center; }
  .msg.err { color: #d92d20; }
  .msg.ok { color: #0a7a3e; }
  .back { display: block; margin-top: 18px; text-align: center; font-size: 14px; color: var(--blue); text-decoration: none; }
</style>
</head>
<body>
  <div class="card">
    <h1>Crear cuenta</h1>
    <p class="sub">Solo para probar el inicio de sesión</p>
    <form id="f">
      <input id="identifier" type="text" placeholder="Correo o nombre de usuario" autocomplete="username" required>
      <input id="password" type="password" placeholder="Contraseña (mínimo 6 caracteres)" autocomplete="new-password" required>
      <button type="submit">Crear cuenta</button>
      <p class="msg" id="msg"></p>
    </form>
    <a class="back" href="/login.html">Ya tengo cuenta, iniciar sesión</a>
  </div>
  <script>
    const f = document.getElementById("f"), msg = document.getElementById("msg");
    f.addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.textContent = ""; msg.className = "msg";
      const identifier = document.getElementById("identifier").value.trim();
      const password = document.getElementById("password").value;
      try {
        const res = await fetch("/api/auth/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ identifier, password })
        });
        const data = await res.json();
        if (res.ok) {
          msg.textContent = "Cuenta creada. Ya puedes iniciar sesión.";
          msg.className = "msg ok";
          setTimeout(() => (location.href = "/login.html"), 1200);
        } else {
          msg.textContent = data.error || "No se pudo crear la cuenta.";
          msg.className = "msg err";
        }
      } catch {
        msg.textContent = "No hay conexión con el servidor.";
        msg.className = "msg err";
      }
    });
  </script>
</body>
</html>
